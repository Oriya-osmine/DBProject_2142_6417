services:
  #---------------
  # PostgresSQL Database
  #---------------
  db:
    image: postgres:17.1
    container_name: PostgreSQL_DB
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER_SECRET}
      POSTGRES_PASSWORD: ${DB_PASSWORD_SECRET}
      POSTGRES_DB: ${DB_NAME_SECRET}
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - ./stage-A:/data/stage-A
      - ./stage-A/DataImportFiles:/data/import
      - ./stage-A/mockarooFiles:/data/mockaroo
      - ./stage-A/DATA:/data/output
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kids_network
  #----------------
  # pgAdmin
  #---------------- 
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgAdminApp
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json
      - ./stage-A:/var/lib/pgadmin/storage/dvirdiei_gmail.com/stage-A 
      - ./stage-C:/var/lib/pgadmin/storage/dvirdiei_gmail.com/stage-C
    depends_on:
      - db
    networks:
      - kids_network
#----------------
# Network
#----------------
networks:
  kids_network:
    #    driver: bridge
    #----------------
    # Volumes
    #---------------- 
volumes:
  postgres_data:
  pgadmin_data:
